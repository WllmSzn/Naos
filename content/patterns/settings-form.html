<!-- {"id":"settings-form","name":"Formulaire de réglages en sections","kind":"form","platform":"app","description":"Sections en deux colonnes (intitulé et explication à gauche, champs à droite), libellés au-dessus, aides sous les champs, interrupteur, barre d'actions en bas.","tags":["form","settings","preferences","inputs","toggle"]} -->
<form class="divide-y divide-line rounded-card border border-line bg-surface">
  <div class="grid gap-6 p-6 md:grid-cols-[1fr_2fr]">
    <div>
      <h2 class="font-display text-lg">Boutique</h2>
      <p class="mt-1 text-sm text-muted">Ces informations apparaissent sur vos bons de commande.</p>
    </div>
    <div class="space-y-4">
      <div>
        <label for="nom" class="mb-1.5 block text-sm font-medium">Nom commercial</label>
        <input id="nom" value="Épicerie Lune" class="w-full rounded-ui border border-line bg-base px-3 py-2.5">
      </div>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium">E-mail pour les fournisseurs</label>
        <input id="email" type="email" value="commandes@epicerie-lune.fr" aria-describedby="email-aide" class="w-full rounded-ui border border-line bg-base px-3 py-2.5">
        <p id="email-aide" class="mt-1.5 text-xs text-muted">Les accusés de réception arrivent à cette adresse.</p>
      </div>
    </div>
  </div>
  <div class="grid gap-6 p-6 md:grid-cols-[1fr_2fr]">
    <div>
      <h2 class="font-display text-lg">Automatisation</h2>
      <p class="mt-1 text-sm text-muted">Choisissez ce que Brève peut faire sans vous.</p>
    </div>
    <label class="flex items-start justify-between gap-6">
      <span><span class="block text-sm font-medium">Envoyer les commandes récurrentes</span><span class="block text-sm text-muted">Pain, lait et œufs partent chaque soir sans validation.</span></span>
      <input type="checkbox" checked class="mt-1 h-5 w-9 shrink-0 accent-accent">
    </label>
  </div>
  <div class="flex justify-end gap-3 p-4">
    <button type="button" class="rounded-ui border border-line px-4 py-2.5 text-sm">Annuler</button>
    <button type="submit" class="rounded-ui bg-accent px-4 py-2.5 text-sm font-medium text-accent-ink">Enregistrer les réglages</button>
  </div>
</form>
