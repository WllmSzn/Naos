<section class="grid gap-4 lg:grid-cols-3">
  <div class="rounded-card border border-line bg-surface p-6 shadow-card lg:col-span-2">
    <p class="text-sm text-muted">Chiffre d'affaires de la semaine</p>
    <p class="mt-2 font-display text-5xl tabular-nums">18 420 <span class="text-2xl text-muted">€</span></p>
    <p class="mt-3 inline-flex items-center gap-1 rounded-full bg-success/10 px-2.5 py-1 text-xs font-medium text-success"><iconify-icon icon="lucide:trending-up"></iconify-icon>+8 % par rapport à la semaine 42</p>
    <div class="mt-6 h-36"><canvas id="ventes" aria-label="Ventes par jour de la semaine"></canvas></div>
  </div>
  <div class="space-y-4">
    <div class="rounded-card border border-line bg-surface p-6 shadow-card">
      <p class="text-sm text-muted">Commandes à valider</p>
      <p class="mt-1 font-display text-3xl tabular-nums">3</p>
      <p class="mt-1 text-sm text-muted">pour 2 140 € HT</p>
    </div>
    <div class="rounded-card border border-danger/30 bg-danger/5 p-6">
      <p class="text-sm text-danger">Ruptures probables</p>
      <p class="mt-1 font-display text-3xl tabular-nums">2 références</p>
      <a href="#" class="mt-2 inline-block py-2 text-sm font-medium underline underline-offset-4">Voir les références</a>
    </div>
  </div>
</section>
<script>
  new Chart(document.getElementById('ventes'), {
    type: 'bar',
    data: { labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], datasets: [{ label: 'Ventes', data: [1900, 2100, 2300, 2500, 3200, 4600, 1820], backgroundColor: NAOS.dataPalette[0], borderRadius: 6 }] },
    options: { maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } } } }
  });
</script>
