<!-- {"id":"side-panel","name":"Panneau latéral","kind":"panel","description":"Panneau qui glisse depuis la droite par-dessus l'écran (aperçu, édition rapide) : en-tête avec fermeture, sections titrées, pied d'actions collant. Fermeture par Échap et clic sur le fond. Ouvert pour l'aperçu.","tags":["drawer","sheet","side panel","quick edit","preview"],"libs":["alpine"]} -->
<div x-data="{ open: true }" @keydown.escape.window="open = false" class="relative min-h-[36rem]">
  <button @click="open = true" class="inline-flex h-ctl items-center rounded-ui border border-line px-3 text-sm">Ouvrir l'aperçu</button>
  <div x-show="open" class="absolute inset-0 bg-ink/30" @click="open = false" aria-hidden="true"></div>
  <aside x-show="open" role="dialog" aria-modal="true" aria-labelledby="panel-title" class="absolute inset-y-0 right-0 flex w-[28rem] max-w-full flex-col border-l border-line bg-surface shadow-overlay">
    <header class="flex h-header items-center justify-between border-b border-line px-4">
      <h2 id="panel-title" class="font-semibold">Comté 18 mois</h2>
      <button @click="open = false" class="grid h-ctl-sm w-ctl-sm place-items-center rounded-ui hover:bg-raised" aria-label="Fermer le panneau"><iconify-icon icon="lucide:x"></iconify-icon></button>
    </header>
    <div class="min-h-0 flex-1 space-y-6 overflow-auto p-4 text-sm">
      <section>
        <h3 class="mb-2 text-xs font-medium uppercase tracking-wide text-muted">Stock</h3>
        <dl class="grid grid-cols-2 gap-3">
          <div><dt class="text-xs text-muted">En rayon</dt><dd class="font-medium tabular-nums">4,2 kg</dd></div>
          <div><dt class="text-xs text-muted">Couverture</dt><dd class="font-medium text-warning">2 jours</dd></div>
        </dl>
      </section>
      <section class="space-y-3">
        <h3 class="text-xs font-medium uppercase tracking-wide text-muted">Réassort</h3>
        <div>
          <label for="panel-qty" class="mb-1.5 block font-medium">Quantité à commander</label>
          <input id="panel-qty" type="number" value="6" aria-describedby="panel-qty-help" class="h-ctl w-32 rounded-ui border border-line bg-base px-3 tabular-nums">
          <p id="panel-qty-help" class="mt-1.5 text-xs text-muted">Suggestion : 6 kg pour tenir jusqu'au mardi 28.</p>
        </div>
      </section>
    </div>
    <footer class="flex justify-end gap-2 border-t border-line p-4">
      <button @click="open = false" class="h-ctl rounded-ui border border-line px-4 text-sm">Annuler</button>
      <button class="h-ctl rounded-ui bg-accent px-4 text-sm font-medium text-accent-ink">Ajouter à la commande</button>
    </footer>
  </aside>
</div>
