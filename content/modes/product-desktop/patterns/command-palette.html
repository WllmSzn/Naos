<div class="mx-auto w-[36rem] max-w-full overflow-hidden rounded-card border border-line bg-surface shadow-overlay" role="dialog" aria-label="Palette de commandes">
  <div class="flex items-center gap-2 border-b border-line px-3">
    <iconify-icon icon="lucide:search" class="text-muted"></iconify-icon>
    <label for="cmd-input" class="sr-only">Rechercher une action ou une page</label>
    <input id="cmd-input" value="comm" class="h-header flex-1 bg-transparent text-sm outline-none" role="combobox" aria-expanded="true" aria-controls="cmd-list" aria-activedescendant="cmd-1">
    <kbd class="rounded-ui border border-line px-1.5 font-mono text-xs text-muted">Échap</kbd>
  </div>
  <ul id="cmd-list" role="listbox" class="max-h-80 overflow-auto py-2 text-sm">
    <li class="px-3 pb-1 pt-2 text-xs font-medium uppercase tracking-wide text-muted" role="presentation">Actions</li>
    <li id="cmd-1" role="option" aria-selected="true" class="mx-2 flex h-ctl items-center gap-3 rounded-ui bg-raised px-2"><iconify-icon icon="lucide:plus" class="text-muted"></iconify-icon>Nouvelle commande<kbd class="ml-auto rounded-ui border border-line px-1.5 font-mono text-xs text-muted">N</kbd></li>
    <li role="option" aria-selected="false" class="mx-2 flex h-ctl items-center gap-3 rounded-ui px-2 hover:bg-raised"><iconify-icon icon="lucide:send" class="text-muted"></iconify-icon>Valider les commandes en attente</li>
    <li class="px-3 pb-1 pt-3 text-xs font-medium uppercase tracking-wide text-muted" role="presentation">Pages</li>
    <li role="option" aria-selected="false" class="mx-2 flex h-ctl items-center gap-3 rounded-ui px-2 hover:bg-raised"><iconify-icon icon="lucide:truck" class="text-muted"></iconify-icon>Commandes fournisseurs<span class="ml-auto text-xs text-muted">Achats</span></li>
    <li class="px-3 pb-1 pt-3 text-xs font-medium uppercase tracking-wide text-muted" role="presentation">Commandes</li>
    <li role="option" aria-selected="false" class="mx-2 flex h-ctl items-center gap-3 rounded-ui px-2 hover:bg-raised"><span class="font-mono text-xs text-muted">CF-0412</span>Fromagerie Bel<span class="ml-auto text-xs text-muted">À valider</span></li>
  </ul>
  <div class="flex items-center gap-4 border-t border-line px-3 py-2 text-xs text-muted">
    <span><kbd class="font-mono">↑↓</kbd> naviguer</span><span><kbd class="font-mono">Entrée</kbd> ouvrir</span><span class="ml-auto"><kbd class="font-mono">⌘K</kbd> depuis n'importe où</span>
  </div>
</div>
